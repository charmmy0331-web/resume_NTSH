<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課外活動 - 謝瑄芸</title>

    <style>
        body {
            margin: 0;
            font-family: "Noto Sans TC", sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            min-height: 100vh;
        }

        header {
            background-color: #1565c0;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin-top: 10px;
            font-size: 16px;
            opacity: 0.9;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        /* 活動卡片包裝 */
        .activity-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            overflow: hidden;
            margin-bottom: 30px;
            text-align: center;
            padding-bottom: 25px;
        }

        /* 關鍵：點進去的頁面照片顯示設定 */
        .activity-card img {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            display: block;
        }

        .activity-card h2 {
            color: #1565c0;
            margin-top: 20px;
            font-size: 22px;
        }

        .activity-card p {
            color: #555;
            padding: 10px 25px 0;
            line-height: 1.6;
            font-size: 15px;
        }

        /* 返回首頁按鈕 */
        .back-btn-container {
            text-align: center;
            margin-top: 30px;
        }

        .back-btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #1565c0;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .back-btn:hover {
            background-color: #0d47a1;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>🌟 課外活動</h1>
    <p>拓展視野，累積多元學習與團隊合作經驗</p>
</header>

<div class="container">

    <!-- 📷 點進去後顯示的照片與介紹卡片 -->
    <div class="activity-card">
        <!-- 這裡放入您的圖片檔名 -->
        <img src="{{ url_for('static', filename='images/28546.jpg') }}" alt="課外活動照片">
        <h2>豐富多元的課外活動</h2>
        <p>課外活動不只是學習課本以外的知識，也能培養團隊合作、溝通能力與解決問題的能力。</p>
    </div>

    <!-- 按鈕：返回首頁 -->
    <div class="back-btn-container">
        <a href="/" class="back-btn">⬅ 返回首頁</a>
    </div>

</div>

<footer>
    © 2026 謝瑄芸 學習歷程檔案
</footer>

</body>
</html>

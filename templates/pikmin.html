        <h3>關於皮克敏</h3>
        <p>皮克敏（Pikmin）是由日本任天堂（Nintendo）推出的經典遊戲 IP，是一種介於植物與動物之間的神奇小生物。</p>
        <p>故事講述玩家率領不同顏色與特性的皮克敏（如紅色耐火、黃色耐電、藍色能在水中呼吸等），在未知星球上探索、搬運物資與對抗強敵的冒險故事。</p>
